<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>Quản lý công trình</title>
<style>
:root{--ink:#1d2433;--muted:#667085;--line:#e3e6ec;--bg:#f4f5f8;--card:#fff;--acc:#0f5c8c;--acc2:#e8f1f8;--warn:#b54708;--warnbg:#fff6ed;--err:#b42318;--errbg:#fef3f2;--ok:#067647}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#12263a;color:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap}
header .proj{color:#9fb3c8;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
header .tb{display:flex;gap:6px}
header button{background:#1f3b57;color:#fff;border:1px solid #2e5274}
header button:hover{background:#28496b}
.wrap{display:flex;height:calc(100% - 56px)}
nav{width:220px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:2px}
nav a .n{width:22px;height:22px;border-radius:50%;background:#eef1f5;color:var(--muted);font-size:12px;display:grid;place-items:center;flex:none}
nav a:hover{background:#f2f4f7}
nav a.on{background:var(--acc2);color:var(--acc);font-weight:600}
nav a.on .n{background:var(--acc);color:#fff}
nav .sep{height:1px;background:var(--line);margin:10px 6px}
nav .chk{font-size:12px;color:var(--muted);padding:6px 12px}
main{flex:1;overflow:auto;padding:22px 28px 60px}
.page{max-width:1180px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:14px;margin:0 0 12px;color:var(--acc);text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px 14px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.s2{grid-column:span 2}
input,select,textarea{font:inherit;color:inherit;border:1px solid #cfd4dc;border-radius:7px;padding:7px 9px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc5e3;border-color:var(--acc)}
textarea{resize:vertical;min-height:60px}
input[type=checkbox]{width:16px;height:16px;padding:0}
button{font:inherit;border:1px solid #cfd4dc;background:#fff;color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:#f2f4f7}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:#0c4a71}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.del{color:var(--err);border-color:transparent;background:transparent;padding:4px 8px}
button.del:hover{background:var(--errbg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.dt th{background:#f7f8fa;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.dt td{padding:5px 4px;border-bottom:1px solid #f0f1f4;vertical-align:top}
table.dt td input,table.dt td textarea{padding:5px 7px}
table.dt td.num{text-align:right;white-space:nowrap;padding-top:11px}
table.dt tr.sel td{background:#f3f9fd}
table.dt tfoot td{font-weight:600;border-top:2px solid var(--line);padding:10px 6px}
.money{font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#eef1f5;color:var(--muted)}
.total{font-size:15px}
.total b{color:var(--acc)}
.words{color:var(--muted);font-style:italic;font-size:13px}
.split{display:grid;grid-template-columns:260px 1fr;gap:16px}
.dots .it{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.dots .it.on{border-color:var(--acc);box-shadow:0 0 0 2px #cfe3f2}
.dots .it b{display:block}
.dots .it span{color:var(--muted);font-size:12px}
.msg{padding:9px 12px;border-radius:8px;margin-bottom:6px;font-size:13px}
.msg.err{background:var(--errbg);color:var(--err)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.ok{background:#ecfdf3;color:var(--ok)}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.sec .hd{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#fafbfc;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.sec .hd .no{font-weight:600;color:var(--acc);min-width:58px}
.sec .bd{padding:10px 12px}
.sec.off{opacity:.55}
.help{font-size:12px;color:var(--muted);background:#f7f8fa;border-radius:8px;padding:8px 10px;margin-bottom:12px}
code{background:#eef1f5;border-radius:4px;padding:0 4px;font-size:12px}
/* preview */
#pv{position:fixed;inset:0;background:rgba(16,24,40,.6);display:none;z-index:20}
#pv.on{display:flex;flex-direction:column}
#pv .bar{background:#12263a;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 16px}
#pv .bar b{flex:1}
#pv .scroll{flex:1;overflow:auto;padding:24px}
.a4{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.25);padding:20mm 20mm 20mm 30mm;font-family:"Times New Roman",Times,serif;font-size:13pt;line-height:1.25;color:#000}
.a4.land{width:297mm;min-height:210mm;padding:15mm 15mm 15mm 20mm}
table.g{border-collapse:collapse;font-size:13px}
table.g th{background:#f7f8fa;color:var(--muted);font-weight:600;padding:6px 4px;border:1px solid var(--line);font-size:12px}
table.g td{border:1px solid #edf0f3;padding:2px}
table.g td input{border:0;border-radius:4px;padding:5px 6px;text-align:right;min-width:64px}
table.g td input.l{text-align:left}
table.g td input:focus{outline:2px solid #9cc5e3}
table.g td.sum{text-align:right;font-weight:600;padding:0 8px;white-space:nowrap;background:#fafbfc}
table.g tr.tot td{background:#f3f9fd;font-weight:700;text-align:right;padding:6px 8px}
.scrollx{overflow-x:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-size:14px}
.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.kv .b{font-weight:700;color:var(--acc)}
.formula{font-size:12px;color:var(--muted);margin-top:4px}
.s5{grid-column:span 5}
table.xl{border-collapse:collapse;font-size:13px;background:#fff}
table.xl th{background:#f3f4f6;color:#555;font-weight:600;font-size:11px;border:1px solid #d8dce3;padding:2px 4px;white-space:nowrap}
table.xl td{border:1px solid #d8dce3;padding:0}
table.xl td input{border:0;border-radius:0;padding:5px 6px;min-width:56px;font-size:13px;background:transparent}
table.xl td input:focus{outline:2px solid #1a73e8;background:#fff;position:relative;z-index:1}
table.xl td input.num{text-align:right}
table.xl td input.f{background:#f6fbff}
table.xl td input.err{color:#b42318;background:#fef3f2}
table.xl tr.off td,table.xl th.off{opacity:.4}
table.xl tr.bold td input{font-weight:700}
table.xl tr.hd td input{font-weight:700;text-align:center;background:#f7f8fa}
table.xl th button{border:0;background:transparent;padding:0 3px;font-size:11px;color:#888;cursor:pointer}
table.xl th button:hover{color:var(--err)}
table.xl th button.on{color:var(--acc);font-weight:800}
table.xl th input[type=checkbox]{width:12px;height:12px;vertical-align:middle}
.fbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:6px 0}
.fbar b{min-width:46px;color:var(--ink)}
table.g .off td,table.g th.off{opacity:.45}
table.g th input{text-align:left;background:#fff;border:1px solid #e3e6ec}
.a4 p{margin:0}
.a4 table{border-collapse:collapse;width:100%;table-layout:fixed;margin:2pt 0 4pt}
.a4 table.bd td{border:1px solid #000;padding:2px 4px}
.a4 table.nb td{padding:0 2px}
.a4 tr.th td{background:#fafafa}
.a4 .pgbreak{border-top:2px dashed #9aa4b2;margin:14mm -20mm 14mm -30mm}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12263a;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.doc{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.doc b{font-size:14px}
.doc span{color:var(--muted);font-size:12px;flex:1}
@media (max-width:900px){nav{width:64px}nav a span.t{display:none}.split{grid-template-columns:1fr}.grid .s3,.grid .s4{grid-column:span 6}}
/* ===== Bố cục add-in (task pane co giãn) ===== */
body{display:flex;flex-direction:column}
header{flex:none;height:auto;min-height:56px;flex-wrap:wrap;padding:8px 14px}
header .tb{flex-wrap:wrap}
.wrap{flex:1;min-height:0;height:auto}
#pv .bar{flex-wrap:wrap}
@media (max-width:760px){
 header{gap:6px;padding:8px 10px}header h1{font-size:14px}header .proj{flex-basis:100%;order:3}
 header button{padding:5px 8px;font-size:12px}
 .wrap{flex-direction:column}
 nav{width:auto;display:flex;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;flex:none}
 nav a{flex:none;margin:0 2px;padding:6px 10px}nav a span.t{display:inline;white-space:nowrap}
 nav .sep{display:none}nav .chk{flex:none;white-space:nowrap}
 main{padding:14px 12px 60px}
 .grid{grid-template-columns:repeat(6,1fr)}
 .grid>*{grid-column:span 6!important}.grid>.s2,.grid>.s3{grid-column:span 3!important}
 .split{grid-template-columns:1fr}
 #pvBody{zoom:.5}#pv .scroll{padding:10px}
}
/* ===== Màn hình khóa / kích hoạt ===== */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#12263a,#0f5c8c);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
#gate .box{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#gate h2{margin:0 0 4px;font-size:18px}#gate p{color:var(--muted);margin:6px 0 12px;font-size:13px}
#gate .lbl{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px}
#gate .fp{font:600 20px/1.2 Consolas,monospace;letter-spacing:1px;color:var(--acc);background:var(--acc2);border-radius:8px;padding:10px;text-align:center}
#gate textarea{font:12px/1.4 Consolas,monospace;word-break:break-all;min-height:70px}
#gate .err{color:var(--err);background:var(--errbg);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
#gate .ok{color:var(--ok)}
#gate .step{display:flex;gap:10px;align-items:flex-start;margin-top:14px}#gate .step b.n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px}
#gate .foot{font-size:11px;color:var(--muted);margin-top:14px;text-align:center}
#lic{position:fixed;inset:0;background:rgba(16,24,40,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#lic.on{display:flex}#lic .box{background:#fff;border-radius:12px;padding:18px;max-width:460px;width:100%}
/* ===== Bảng co giãn ===== */
.tblwrap{overflow-x:auto;overflow-y:visible;padding-bottom:6px;scrollbar-width:auto;scrollbar-color:#9aa4b2 #eef1f5}
.tblwrap::-webkit-scrollbar{height:14px}.tblwrap::-webkit-scrollbar-track{background:#eef1f5;border-radius:7px}.tblwrap::-webkit-scrollbar-thumb{background:#9aa4b2;border-radius:7px;border:3px solid #eef1f5}.tblwrap::-webkit-scrollbar-thumb:hover{background:#667085}
table.rzt{table-layout:fixed;max-width:none}
table.rzt th{position:relative;white-space:normal;vertical-align:bottom}
table.rzt td{overflow:hidden}
table.rzt input,table.rzt select,table.rzt textarea{width:100%;min-width:0}
table.rzt textarea.ta{resize:vertical;min-height:34px;line-height:1.4;overflow:hidden}
.rzh{position:absolute;top:0;right:-5px;bottom:0;width:10px;cursor:col-resize;z-index:3;touch-action:none}
.rzh::after{content:'';position:absolute;top:20%;bottom:20%;left:4px;width:2px;background:#cfd4dc;border-radius:1px}
.rzh:hover::after,.rzh.on::after{background:var(--acc);top:0;bottom:0}
.help button.ghost{padding:2px 8px;font-size:12px;margin-left:6px}
.kvl{grid-template-columns:auto 1fr}.kvl div:nth-child(even){text-align:left}
#gate input{font:inherit;border:1px solid #cfd4dc;border-radius:7px;padding:8px 10px;width:100%}
#gate a{color:var(--acc)}
#lic input{font:inherit;border:1px solid #cfd4dc;border-radius:7px;padding:7px 9px;width:100%}
#lic .box{max-height:90vh;overflow:auto}
/* ===================== RIBBON (kiểu Office) ===================== */
body.rb-on header{height:auto;min-height:0;padding:6px 14px;background:#0f3b5c}
body.rb-on header h1{font-size:14px}
body.rb-on header .tb{display:none}
body.rb-on header .proj{opacity:.85;font-size:12.5px}
body.rb-nonav nav#nav{display:none!important}
#rb{flex:none;background:#f3f3f3;border-bottom:1px solid #d6d9de;position:relative;z-index:20;user-select:none;font-family:"Segoe UI",system-ui,sans-serif}
.rb-tabs{display:flex;align-items:flex-end;gap:2px;padding:4px 10px 0;height:34px}
.rb-tab{border:0;background:none;padding:6px 12px 7px;font-size:13.5px;color:#323130;border-radius:6px 6px 0 0;position:relative;cursor:pointer}
.rb-tab:hover{background:#e6e6e6}
.rb-tab.on{color:#0f5c8c;font-weight:600}
.rb-tab.on::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:2px;background:#0f5c8c}
.rb-sp{flex:1}
.rb-user{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#505a66;padding:0 10px 7px}
.rb-user svg{width:15px;height:15px}
.rb-min{border:0;background:none;font-size:13px;color:#505a66;padding:4px 8px 7px;cursor:pointer;border-radius:4px}.rb-min:hover{background:#e6e6e6}
.rb-body{display:flex;align-items:stretch;background:#fff;margin:0 8px 6px;border:1px solid #e1e3e6;border-radius:8px;padding:4px 2px 0;min-height:104px;overflow-x:auto;overflow-y:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.rb-g{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid #e1e3e6;flex:none}
.rb-g:last-child{border-right:0}
.rb-items{display:flex;align-items:flex-start;gap:2px;flex:1}
.rb-gl{font-size:11.5px;color:#605e5c;text-align:center;padding:2px 0 4px;white-space:nowrap}
.rb-col{display:flex;flex-direction:column;gap:1px;padding-top:2px}
.rb-big,.rb-sm{border:1px solid transparent;background:none;cursor:pointer;color:#252423;border-radius:5px;font:inherit}
.rb-big{display:flex;flex-direction:column;align-items:center;width:auto;min-width:56px;max-width:92px;padding:4px 6px 3px;font-size:12.5px;line-height:1.2;text-align:center;min-height:76px}
.rb-big i{width:34px;height:34px;display:block;margin:2px 0 4px}
.rb-big span{white-space:normal}
.rb-sm{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 5px;font-size:12.5px;white-space:nowrap;height:26px;text-align:left}
.rb-sm i{width:18px;height:18px;display:block;flex:none}
.rb-big svg,.rb-sm svg,.rb-mi i svg{width:100%;height:100%;display:block}
.rb-big:hover,.rb-sm:hover{background:#f0f4f8;border-color:#d7e2ec}
.rb-big.on,.rb-sm.on{background:#dfeaf4;border-color:#b6cde2}
.rb-big.open,.rb-sm.open{background:#cfe0f0;border-color:#9fbfdc}
.car{font-size:9px;color:#605e5c;font-weight:400}
body.rb-mini .rb-body{display:none}
body.rb-mini.rb-peek .rb-body{display:flex;position:absolute;left:0;right:0;top:34px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* menu */
.rb-menu{position:fixed;z-index:60;background:#fff;border:1px solid #d6d9de;border-radius:8px;box-shadow:0 10px 30px rgba(16,24,40,.18);padding:6px;min-width:250px;max-width:min(560px,92vw);max-height:80vh;overflow:auto;font-family:"Segoe UI",system-ui,sans-serif}
.rb-mi{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:6px;cursor:pointer}
.rb-mi i{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center}
.rb-mi>div{flex:1;min-width:0}
.rb-mi b{display:block;font-size:13.5px;font-weight:600;color:#201f1e}
.rb-mi span{display:block;font-size:12.5px;color:#605e5c;margin-top:1px}
.rb-mi em{font-style:normal;color:#605e5c;font-size:18px;padding-left:12px}
.rb-mi:hover,.rb-mi.hov{background:#eef4fa}
.rb-mi.on b{color:#0f5c8c}
.rb-mi.dis{opacity:.5;cursor:default}
.rb-mi .tick{color:#0f5c8c;font-size:15px}
.rb-msep{height:1px;background:#e5e7eb;margin:5px 6px}
.rb-mhead{font-size:11.5px;font-weight:700;color:#605e5c;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px 4px}
/* thanh trạng thái */
#sb{flex:none;display:flex;justify-content:space-between;gap:10px;align-items:center;height:26px;padding:0 14px;background:#f3f3f3;border-top:1px solid #d6d9de;font-size:12px;color:#505a66;overflow:hidden;white-space:nowrap}
#sb>div{display:flex;gap:16px;align-items:center;overflow:hidden}
#sb b{color:#252423;font-weight:600}
#sb .e{color:var(--err);cursor:pointer}#sb .w{color:#b54708;cursor:pointer}#sb .ok{color:var(--ok);cursor:pointer}
/* hộp thoại */
#rbDlg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#rbDlg.on{display:flex}
#rbDlg .box{background:#fff;border-radius:12px;max-width:620px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#rbDlg .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
#rbDlg .hd b{font-size:15px}#rbDlg .hd button{border:0;background:none;font-size:16px;cursor:pointer}
#rbDlgB{padding:14px 18px 18px}
#rbDlgB .msg{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13.5px}
@media (max-width:760px){.rb-body{min-height:0}.rb-big{min-height:66px;min-width:50px;font-size:11.5px}.rb-big i{width:28px;height:28px}.rb-user span{display:none}#sbR span:nth-child(2){display:none}}
@media print{#rb,#sb{display:none}}
/* ===== Ảnh CCCD ===== */
.ccc{display:flex;gap:6px}
.ccs{position:relative;width:76px;height:48px;border:1.5px dashed #b8c2cf;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#f8fafc;overflow:hidden;flex:none}
.ccs span{font-size:11px;color:#667085;white-space:nowrap}
.ccs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.ccs.has{border-style:solid;border-color:#9fbfdc}.ccs.has img{display:block}.ccs.has span{display:none}
.ccs:hover{border-color:var(--acc);box-shadow:0 0 0 2px rgba(15,92,140,.15)}
.cc-tools{margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.ccdlg{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:14px}
.ccdlg.on{display:flex}
.ccdlg .box{background:#fff;border-radius:12px;max-width:940px;width:100%;max-height:94vh;overflow:auto;padding:14px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ccdlg .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ccdlg .hd b{font-size:15px}.ccdlg .hd button{border:0;background:none;font-size:17px;cursor:pointer}
.ccStage{position:relative;background:#1f2933;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:240px;overflow:hidden;user-select:none}
#ccIm{max-width:100%;max-height:62vh;display:block}
#ccBox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none;border-radius:6px}
#ccBox i{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--acc);border-radius:50%}
#ccBox i[data-h=tl]{left:-9px;top:-9px;cursor:nwse-resize}#ccBox i[data-h=br]{right:-9px;bottom:-9px;cursor:nwse-resize}#ccBox i[data-h=tr]{right:-9px;top:-9px;cursor:nesw-resize}#ccBox i[data-h=bl]{left:-9px;bottom:-9px;cursor:nesw-resize}
#ccBox em{position:absolute;left:6px;top:4px;color:#fff;font:600 11px/1 Arial;font-style:normal;text-shadow:0 1px 2px #000;pointer-events:none}
.nclist{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.ncrow{display:grid;grid-template-columns:22px 1fr;column-gap:8px;padding:8px 12px;border-bottom:1px solid #f0f2f5;cursor:pointer;align-items:center}
.ncrow b{font-size:13.5px}.ncrow span{grid-column:2;font-size:12.5px;color:var(--muted)}.ncrow .ad{font-size:12px}
.ncrow em{grid-column:2;font-size:11.5px;color:var(--ok);font-style:normal}
.ncrow input{grid-row:span 3}.ncrow.in{opacity:.6}.ncrow:hover{background:#f5f8fb}
.lawrow{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.lawrow .lt{font-size:12.5px;color:var(--muted);margin-bottom:4px}.lawrow .lo code{background:#fdecea;color:#912018;text-decoration:line-through}.lawrow .ln code{background:#ecfdf3;color:#05603a}
.lawrow code{white-space:normal;font-size:12.5px;padding:1px 4px;border-radius:4px;line-height:1.6}
.loai{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.loai .lo{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:block;background:#fafbfc}
.loai .lo input{margin-right:6px}.loai .lo b{font-size:14px}.loai .lo span{display:block;font-size:12.5px;color:var(--muted);margin:4px 0 0 22px}
.loai .lo.on{border-color:var(--acc);background:var(--acc2)}
.s7{grid-column:span 7}.s9{grid-column:span 9}
@media (max-width:760px){.s7,.s9{grid-column:span 6}}
#tPL.plsplit{min-width:1280px}
#imCol{width:auto;display:inline-block}
.dkhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:3;background:var(--bg,#f4f6f9);padding:6px 0 4px}
.dkhead h2{margin:0;flex:1}.dkbtn{display:flex;gap:8px;flex-wrap:wrap}
.dkbtn button{padding:9px 14px;font-size:14px}.dkbtn .lawb{background:#fff7e6;border-color:#e8b74a;color:#7a4b00}
.loai .lo input{width:auto!important;display:inline-block;margin:0 6px 0 0;vertical-align:middle}

async function mount(r){
 var js=await GKC.decryptCore(r.K,ENC);
 if(!/var QL = \(function/.test(js)){r.K.fill(0);return fatal('File core.enc.js trên máy chủ KHÔNG phải của phần mềm Quản lý công trình (đang là lõi của phần mềm '+(/var HD = \(function/.test(js)?'Hợp đồng A–B':'Giao khoán tổ đội')+'). Hãy tải lên repo qlct ĐÚNG các file trong gói PhatHanh_QuanLyCongTrinh_….zip (nhất là core.enc.js), đợi 1–2 phút rồi bấm Ctrl+F5.')}
 DK=await GKC.dataKey(r.K);ST=CVSTORE({P:'qlct',SKEY:SKEY,DK:function(){return DK},inExcel:function(){return HOST.inExcel},cfg:CFG});await ST.ready;r.K.fill(0);
 LIC=r.lic;HOST.inExcel=inExcel;localStorage.removeItem('qlct_lock');
 $('#gate').remove();
 document.body.insertAdjacentHTML('afterbegin',$('#appTpl').innerHTML);
 try{CVS.mountUI();CVS.mountSync(ST.sync)}catch(e){console.warn(e)}
 $('#licClose').onclick=function(){$('#lic').classList.remove('on')};
 $('#licOut').onclick=HOST.logout;
 if(LIC.han)setInterval(function(){if(Date.now()>GKC.endOfDay(LIC.han)){alert('Giấy phép đã hết hạn.');location.reload()}},3600000);
 (new Function('HOST',js))(HOST);
}
async function boot(){
 if(CFG&&CFG.chuSoHuu)$('#gOwner').textContent='Bản quyền thuộc '+CFG.chuSoHuu+'.';
 if(!window.crypto||!crypto.subtle)return fatal('Môi trường này không hỗ trợ mã hóa (WebCrypto). Hãy dùng Chrome/Edge bản mới, hoặc cập nhật Office/Windows.');
 if(!CFG||!ENC)return fatal('Thiếu file config.js hoặc core.enc.js trong thư mục phát hành.');
 if(ENC.kcv!==CFG.kcv)return fatal('config.js và core.enc.js không cùng một bộ khóa – hãy chép lại đủ 2 file từ cùng một lần đóng gói (rồi bấm Ctrl+F5).');
 if(!CFG.tk||!CFG.tk.h)return fatal('Bản phát hành chưa có tài khoản đăng nhập – hãy đóng gói lại bằng Công cụ chủ sở hữu bản mới.');
 inExcel=await officeReady();
 var ss=await CVS.load(CFG);if(ss){USER=ss.user;$('#gBusy').textContent='Đang mở phần mềm (đã đăng nhập)…';try{await mount(ss.r);return}catch(e){console.error(e);CVS.clear();location.reload();return}}
 var last=localStorage.getItem('qlct_last_user')||'';$('#lUser').value=last;
 show('#gLogin');setTimeout(function(){(last?$('#lPass'):$('#lUser')).focus()},50);
}
document.addEventListener('click',async function(ev){var t=ev.target;if(t.id!=='lGo')return;
 err('#lErr','');var w=lockLeft();if(w)return err('#lErr','Nhập sai nhiều lần – thử lại sau '+w+' giây.');t.disabled=true;t.textContent='Đang kiểm tra…';
 try{var u=GKC.normSdt($('#lUser').value);if(!u)throw gkErr('Nhập tên đăng nhập.');
  var r=await GKC.openAcc(CFG.tk.h,CFG.tk.e,u,$('#lPass').value,CFG);await CVS.save(CFG,u,r.inner);USER=u;localStorage.setItem('qlct_last_user',u);await mount(r)}
 catch(e){if(/Sai số điện thoại|không phải của số/.test(e.message)){failOnce();e=gkErr('Sai tên đăng nhập hoặc mật khẩu.')}console.error(e);err('#lErr',e.gk?e.message:'Lỗi: '+e.message);t.disabled=false;t.textContent='🔓 Đăng nhập'}
});
boot();
})();
</script>
</body>
</html>
